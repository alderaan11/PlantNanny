openapi: 3.1.0
info:
  title: PlantNanny API
  version: 1.0.0
  description: >
    API pour gérer les comptes, appareils ESP32, ingestion des capteurs (température/humidité/luminosité),
    historique, temps réel, et commandes (force reading, arrosage/pompe, OTA).

servers:
  - url: http://localhost:8080
    description: Local dev
  - url: https://api.example.com
    description: Production

tags:
  - name: Auth
  - name: Devices
  - name: Readings
  - name: Realtime
  - name: Commands
  - name: OTA

paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema: { type: string }

  /v1/me:
    get:
      tags: [Auth]
      summary: Get current user profile (from token)
      security: [{ FirebaseJwt: [] }]
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/devices:
    get:
      tags: [Devices]
      summary: List devices for current user
      security: [{ FirebaseJwt: [] }]
      responses:
        "200":
          description: List of devices
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/devices:register:
    post:
      tags: [Devices]
      summary: Register (pair) a device to the authenticated user
      description: >
        Utilisé après appairage BLE/provisioning : l'app obtient un pairingCode depuis l'ESP32,
        puis appelle cette route pour associer le device au user.
      security: [{ FirebaseJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterDeviceRequest" }
            examples:
              example:
                value:
                  pairingCode: "ABCD-1234"
                  name: "Mon basilic"
      responses:
        "200":
          description: Registered device
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Pairing code invalid/expired or already used
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/devices/{deviceId}:
    get:
      tags: [Devices]
      summary: Get device details
      security: [{ FirebaseJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Device
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

    patch:
      tags: [Devices]
      summary: Update device (rename, metadata)
      security: [{ FirebaseJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateDeviceRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/devices/{deviceId}:unregister:
    post:
      tags: [Devices]
      summary: Unregister device from current user
      security: [{ FirebaseJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "204":
          description: Unregistered
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/devices/{deviceId}/status:
    get:
      tags: [Devices]
      summary: Get device status (connectivity, lastSeen, firmware)
      security: [{ FirebaseJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------- Readings (ESP32 -> API ingestion, Flutter -> API queries) ----------
  /v1/devices/{deviceId}/readings:
    post:
      tags: [Readings]
      summary: Ingest a sensor reading (ESP32)
      security: [{ DeviceKey: [] }]
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReadingIn" }
            examples:
              example:
                value:
                  temperatureC: 22.4
                  humidityPct: 55.2
                  luminosityPct: 12.3
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reading" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Invalid device key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

    get:
      tags: [Readings]
      summary: Query readings history (Flutter)
      security: [{ FirebaseJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - in: query
          name: from
          description: ISO-8601 datetime (UTC). Inclusive.
          schema: { type: string, format: date-time }
        - in: query
          name: to
          description: ISO-8601 datetime (UTC). Exclusive.
          schema: { type: string, format: date-time }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 2000, default: 200 }
        - in: query
          name: order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: List of readings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadingList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/devices/{deviceId}/readings/last:
    get:
      tags: [Readings]
      summary: Get last reading
      security: [{ FirebaseJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Last reading
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reading" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No data yet or device not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/devices/{deviceId}/readings/aggregate:
    get:
      tags: [Readings]
      summary: Aggregate readings for charts (optional but useful)
      description: >
        Retourne des buckets pour graphe (ex: moyenne par 5min/1h).
        Permet d'éviter de télécharger des milliers de points.
      security: [{ FirebaseJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - in: query
          name: from
          required: true
          schema: { type: string, format: date-time }
        - in: query
          name: to
          required: true
          schema: { type: string, format: date-time }
        - in: query
          name: bucket
          required: true
          schema:
            type: string
            enum: [1m, 5m, 15m, 1h, 6h, 1d]
      responses:
        "200":
          description: Aggregated points
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AggregateSeries" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------- Realtime ----------
  /v1/devices/{deviceId}/stream:
    get:
      tags: [Realtime]
      summary: Server-Sent Events stream (API-only realtime)
      description: >
        Optionnel si tu utilises déjà Firestore listeners.
        Flux SSE d'événements: reading, status, commandUpdate.
      security: [{ FirebaseJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: SSE stream (text/event-stream)
          content:
            text/event-stream:
              schema:
                type: string
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------- Commands (Flutter -> create, ESP32 -> poll/ack) ----------
  /v1/devices/{deviceId}/commands:
    post:
      tags: [Commands]
      summary: Create a command for a device (force reading, pump, etc.)
      security: [{ FirebaseJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommandIn" }
            examples:
              force_reading:
                value: { type: force_reading }
              pump_water:
                value: { type: pump_water, durationMs: 5000, amountMl: 30 }
      responses:
        "201":
          description: Command created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Command" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

    get:
      tags: [Commands]
      summary: List commands (for UI history/debug)
      security: [{ FirebaseJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Commands
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/devices/{deviceId}/commands/pending:
    get:
      tags: [Commands]
      summary: ESP32 polls pending commands
      security: [{ DeviceKey: [] }]
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - in: query
          name: max
          schema: { type: integer, minimum: 1, maximum: 20, default: 5 }
      responses:
        "200":
          description: Pending commands
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandList" }
        "401":
          description: Invalid device key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/devices/{deviceId}/commands/{commandId}:ack:
    post:
      tags: [Commands]
      summary: ESP32 acknowledges command execution result
      security: [{ DeviceKey: [] }]
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/CommandId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommandAck" }
            examples:
              ok:
                value: { status: done }
              failed:
                value: { status: failed, errorMessage: "Pump timeout" }
      responses:
        "200":
          description: Updated command
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Command" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Invalid device key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------- OTA (optional placeholders) ----------
  /v1/devices/{deviceId}/ota:
    post:
      tags: [OTA]
      summary: Request OTA check/update
      description: >
        Typiquement, l'app crée une commande ota_check (ou ota_update) via /commands.
        Cette route est un raccourci possible.
      security: [{ FirebaseJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                version: { type: string }
      responses:
        "201":
          description: Created OTA command
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Command" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  parameters:
    DeviceId:
      in: path
      name: deviceId
      required: true
      schema: { type: string }
      description: Unique device identifier (e.g., esp32-1)
    CommandId:
      in: path
      name: commandId
      required: true
      schema: { type: string }
      description: Command identifier

  securitySchemes:
    FirebaseJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase Authentication JWT
    DeviceKey:
      type: apiKey
      in: header
      name: x-device-key
      description: Shared secret key for device authentication

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
        details: { type: object, additionalProperties: true }
      required: [error]

    UserProfile:
      type: object
      properties:
        uid: { type: string }
        email: { type: string }
        displayName: { type: string }
      required: [uid]

    Device:
      type: object
      properties:
        deviceId: { type: string }
        name: { type: string }
        ownerUid: { type: string }
        createdAt: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time }
        firmwareVersion: { type: string }
      required: [deviceId, createdAt]

    DeviceList:
      type: object
      properties:
        count: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/Device" }
      required: [count, items]

    DeviceStatus:
      type: object
      properties:
        deviceId: { type: string }
        online: { type: boolean }
        lastSeen: { type: string, format: date-time }
        wifiRssi: { type: integer }
        ip: { type: string }
        firmwareVersion: { type: string }
      required: [deviceId, online]

    RegisterDeviceRequest:
      type: object
      properties:
        pairingCode:
          type: string
          description: Short-lived pairing code obtained from device (via BLE/provisioning)
        name:
          type: string
          description: Friendly name for the device
      required: [pairingCode]

    UpdateDeviceRequest:
      type: object
      properties:
        name: { type: string }
      additionalProperties: false

    ReadingIn:
      type: object
      properties:
        ts:
          type: string
          format: date-time
          description: Optional; if omitted, server uses receive time (UTC)
        temperatureC: { type: number }
        humidityPct:
          type: number
          minimum: 0
          maximum: 100
        luminosityPct:
          type: number
          minimum: 0
          maximum: 100
      required: [temperatureC, humidityPct, luminosityPct]
      additionalProperties: false

    Reading:
      type: object
      properties:
        id: { type: string }
        deviceId: { type: string }
        ts: { type: string, format: date-time }
        temperatureC: { type: number }
        humidityPct: { type: number }
        luminosityPct: { type: number }
      required: [id, deviceId, ts, temperatureC, humidityPct, luminosityPct]

    ReadingList:
      type: object
      properties:
        count: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/Reading" }
      required: [count, items]

    AggregatePoint:
      type: object
      properties:
        ts: { type: string, format: date-time }
        temperatureC_avg: { type: number }
        humidityPct_avg: { type: number }
        luminosityPct_avg: { type: number }
        temperatureC_min: { type: number }
        temperatureC_max: { type: number }
      required: [ts]
      additionalProperties: true

    AggregateSeries:
      type: object
      properties:
        bucket: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/AggregatePoint" }
      required: [bucket, from, to, items]

    CommandType:
      type: string
      enum:
        - force_reading
        - pump_water
        - pump_on
        - pump_off
        - ota_check
        - ota_update

    CommandIn:
      type: object
      properties:
        type: { $ref: "#/components/schemas/CommandType" }
        # pump_water/pump_on can use duration or amount
        durationMs:
          type: integer
          minimum: 0
          description: Pump run duration in milliseconds (recommended for pump control)
        amountMl:
          type: number
          minimum: 0
          description: Optional target amount in ml (if you can measure/estimate flow)
        # optional metadata
        requestedBy:
          type: string
          description: Optional (server may fill with user uid)
      required: [type]
      additionalProperties: false

    CommandStatus:
      type: string
      enum: [pending, sent, done, failed, canceled]

    Command:
      type: object
      properties:
        id: { type: string }
        deviceId: { type: string }
        type: { $ref: "#/components/schemas/CommandType" }
        status: { $ref: "#/components/schemas/CommandStatus" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        durationMs: { type: integer }
        amountMl: { type: number }
        errorMessage: { type: string }
      required: [id, deviceId, type, status, createdAt]

    CommandList:
      type: object
      properties:
        count: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/Command" }
      required: [count, items]

    CommandAck:
      type: object
      properties:
        status:
          type: string
          enum: [done, failed]
        errorMessage:
          type: string
      required: [status]
      additionalProperties: false
