v1/firmware:
  get:
    summary: Get current firmware information
    operationId: handlers.v1.firmware.get
    tags:
      - OTA
    security:
      - FirebaseJwt: []
    responses:
      '200':
        description: Firmware information
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: string
                  example: "1.2.0"
                url:
                  type: string
                  example: "https://example.com/firmware/v1.2.0.bin"
                filename:
                  type: string
                  example: "firmware_v1.2.0.bin"
                size:
                  type: integer
                  example: 1048576
                checksum:
                  type: string
                  example: "abc123..."
                uploadedAt:
                  type: string
                  format: date-time

  post:
    summary: Upload new firmware version and trigger OTA
    operationId: handlers.v1.firmware.post
    tags:
      - OTA
    security:
      - FirebaseJwt: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - version
              - url
            properties:
              version:
                type: string
                description: Firmware version
                example: "1.2.0"
              url:
                type: string
                description: URL where firmware binary is hosted
                example: "https://example.com/firmware/v1.2.0.bin"
              triggerOta:
                type: boolean
                description: Whether to trigger OTA for all devices
                default: true
              filename:
                type: string
                description: Original filename
              size:
                type: integer
                description: File size in bytes
              checksum:
                type: string
                description: MD5 or SHA256 checksum
    responses:
      '200':
        description: Firmware updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: string
                url:
                  type: string
                uploadedAt:
                  type: string
                  format: date-time
                previousVersion:
                  type: string
                otaTriggered:
                  type: boolean
                otaStatus:
                  type: string
                otaResult:
                  type: object
      '400':
        description: Missing required fields

v1/firmware/devices:
  get:
    summary: Get firmware version status for all devices
    operationId: handlers.v1.firmware.devices_get
    tags:
      - OTA
    security:
      - FirebaseJwt: []
    responses:
      '200':
        description: Device firmware status
        content:
          application/json:
            schema:
              type: object
              properties:
                latestVersion:
                  type: string
                totalDevices:
                  type: integer
                upToDate:
                  type: integer
                needsUpdate:
                  type: integer
                devices:
                  type: array
                  items:
                    type: object
                    properties:
                      deviceId:
                        type: string
                      name:
                        type: string
                      currentVersion:
                        type: string
                      latestVersion:
                        type: string
                      upToDate:
                        type: boolean
                      lastSeen:
                        type: string
                        format: date-time

v1/devices/{deviceId}/firmware/ota:
  post:
    summary: Trigger OTA update for a specific device
    operationId: handlers.v1.firmware.device_ota_post
    tags:
      - OTA
    security:
      - FirebaseJwt: []
    parameters:
      - $ref: '../components/parameters.yaml#/DeviceId'
    responses:
      '200':
        description: OTA triggered successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId:
                  type: string
                status:
                  type: string
                firmwareUrl:
                  type: string
                targetVersion:
                  type: string
      '202':
        description: OTA trigger pending
      '400':
        description: No firmware URL configured
      '404':
        description: Device not found
