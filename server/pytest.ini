[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_default_fixture_loop_scope = session
addopts = -v --tb=short

# To use docker-compose test database on port 5433:
#   export TEST_DATABASE_URL=postgresql+asyncpg://plantnanny:plantnanny_secret@localhost:5433/plantnanny_test
